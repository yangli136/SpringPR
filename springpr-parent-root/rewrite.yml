---
type: specs.openrewrite.org/v1beta/recipe
name: com.yourorg.FindMethodsExample
displayName: Find method usages example
recipeList:
  - org.openrewrite.analysis.search.FindMethods:
      methodPattern: java.util.List add(..)

---
type: specs.openrewrite.org/v1beta/recipe
name: com.yourorg.FindFlowBetweenMethodsExample
displayName: Finds flow between two methods example
recipeList:
  - org.openrewrite.analysis.search.FindFlowBetweenMethods:
      startMethodPattern: java.util.List add(..)
      endMethodPattern: java.util.List add(..)
      target: null
      flow: null

---
type: specs.openrewrite.org/v1beta/recipe
name: com.yourorg.ControlFlowVisualizationExample
displayName: Control flow visualization example
recipeList:
  - org.openrewrite.analysis.controlflow.ControlFlowVisualization:
      includeDotfile: false

---
type: specs.openrewrite.org/v1beta/recipe
name: com.yourorg.UpdateMavenProjectPropertyJavaVersionExample
displayName: Update Maven Java project properties example
recipeList:
  - org.openrewrite.maven.UpdateMavenProjectPropertyJavaVersion:
      version: 25

---
type: specs.openrewrite.org/v1beta/recipe
name: com.yourorg.UseMavenCompilerPluginReleaseConfigurationExample
displayName: Use Maven compiler plugin release configuration example
recipeList:
  - org.openrewrite.maven.UseMavenCompilerPluginReleaseConfiguration:
      releaseVersion: 25

---
type: specs.openrewrite.org/v1beta/recipe
name: com.yourorg.ExcludeDependencyExample
displayName: Exclude Maven dependency example
recipeList:
  - org.openrewrite.maven.ExcludeDependency:
      groupId: org.springframework.boot
      artifactId: spring-boot-starter-logging
      scope: compile
  - org.openrewrite.maven.ExcludeDependency:
      groupId: ch.qos.logback
      artifactId: logback-access
      scope: compile
  - org.openrewrite.maven.ExcludeDependency:
      groupId: ch.qos.logback
      artifactId: logback-classic
      scope: compile
  - org.openrewrite.maven.ExcludeDependency:
      groupId: ch.qos.logback
      artifactId: logback-core
      scope: compile
  - org.openrewrite.maven.ExcludeDependency:
      groupId: org.slf4j
      artifactId: log4j-over-slf4j
      scope: compile

      
